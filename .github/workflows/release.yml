name: release

# Pushing a tag `vX.Y.Z` builds the release and opens it as a DRAFT on GitHub. Nothing is
# public until a person reads the draft and presses Publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build a draft release for, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag must name the version the package declares
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module=$(python -c "import skygraph; print(skygraph.__version__)")
          test "v$version" = "$TAG" || { echo "tag $TAG but pyproject says $version"; exit 1; }
          test "$module" = "$version" || { echo "__version__ $module but pyproject says $version"; exit 1; }

      - name: Install, then run the suite as installed
        run: |
          python -m pip install --quiet . build
          python -m unittest discover -s tests -t .

      - name: Build the wheel and the source archive
        run: python -m build --outdir dist

      - name: Release notes from the changelog section
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          found = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not found:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          install = (f"\n\n## Install\n\n```bash\npipx install "
                     f"\"git+https://github.com/${{ github.repository }}.git@{os.environ['TAG']}\"\n```\n")
          open("notes.md", "w", encoding="utf-8").write(found.group(1).strip() + install)
          EOF

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "skygraph ${TAG#v}" --notes-file notes.md
