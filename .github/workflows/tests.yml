name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite needs nothing installed to run, so it runs twice: bare, which is
    # the fallback when the parsers cannot load, and after `pip install .`, which
    # is the default install. If a version of Python the README claims support
    # for stops working, this is where it shows.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint — syntax errors and undefined or unused names only
        run: |
          python -m pip install --quiet ruff
          ruff check --select E9,F skygraph tests

      - name: Run the suite without the parsers — the fallback when they cannot load
        run: python -m unittest discover -s tests -t . -v

      - name: Build the package — the query files must ship as package data
        run: |
          python -m pip install --quiet build
          python -m build --outdir /tmp/dist
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('/tmp/dist/*.whl')[0]); names=z.namelist(); assert sum(n.endswith('.scm') for n in names) == 10, names"
          python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('/tmp/dist/*.whl')[0]).namelist(); assert any(n.endswith('demo_sample/shop/api.py') for n in names) and any(n.endswith('demo_sample/Dockerfile') for n in names), names"
          python -c "import tarfile,glob; names=tarfile.open(glob.glob('/tmp/dist/*.tar.gz')[0]).getnames(); assert any(n.endswith('tests/test_benchmark.py') for n in names) and any('tests/fixtures/bench_js' in n for n in names), names"

      # And again as installed, because the tier that reads every language other
      # than Python only runs when the parsers are present. Skipped tests are not
      # evidence, so both configurations are exercised.
      - name: Install the package — the parsers come with it
        run: python -m pip install --quiet .

      - name: Run the suite again, with the parser tier live
        run: python -m unittest discover -s tests -t . -v

      - name: The demo runs from the installed package
        run: cd /tmp && skygraph demo
