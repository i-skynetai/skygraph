name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite is standard library only, so this is the whole build: no
    # install step, no lockfile, nothing to drift. If a version of Python
    # the README claims support for stops working, this is where it shows.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint — syntax errors and undefined or unused names only
        run: |
          python -m pip install --quiet ruff
          ruff check --select E9,F skygraph tests

      - name: Run the suite — standard library only, which is the default install
        run: python -m unittest discover -s tests -t . -v

      - name: Build the package — the query files must ship as package data
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir /tmp/dist
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('/tmp/dist/*.whl')[0]); names=z.namelist(); assert any(n.endswith('queries/typescript.scm') for n in names), names"

      # And again with the optional parsers, because the tier that reads every
      # language other than Python only runs when they are present. Skipped tests
      # are not evidence, so both configurations are exercised.
      - name: Install the optional parsers
        run: python -m pip install --quiet '.[parsers]'

      - name: Run the suite again, with the parser tier live
        run: python -m unittest discover -s tests -t . -v
